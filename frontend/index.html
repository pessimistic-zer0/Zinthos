<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0814" />
    <meta
      name="description"
      content="Zinthos — search 255 million tracks by how they sound and feel."
    />
    <title>Zinthos — A different way to listen</title>
    <!-- The hero art was the favicon until now, and at 16px a full-length figure is a
         smudge. This is the face alone, cropped to its own bbox and padded square, with
         every size a browser or OS asks for in the one .ico.

         NOT NAMED favicon.ico ON PURPOSE. A Hugging Face static Space special-cases that
         exact path and serves its OWN icon there, shadowing the file in the repo — the
         upload succeeds, the repo copy is byte-correct, and the browser still gets
         Hugging Face's icon. Measured: /favicon.ico came back 205,556 bytes against our
         74,121, while /apple-touch-icon.png returned ours untouched, so only that one
         path is claimed. An explicit rel="icon" beats the browser's default probe, so any
         other name works. -->
    <link rel="icon" href="/raven.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/assets/raven-hero.png" />
    <!-- The matrix screen is built during the warp, so its art must already be decoded
         when the flash clears — otherwise the cards fly in empty. -->
    <link rel="prefetch" as="image" href="/assets/collage-bg.jpg" />
    <link rel="prefetch" as="image" href="/assets/personas/card-01.jpg" />
    <link rel="prefetch" as="image" href="/assets/personas/card-02.jpg" />
    <link rel="prefetch" as="image" href="/assets/personas/card-03.jpg" />
    <link rel="prefetch" as="image" href="/assets/personas/card-04.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
